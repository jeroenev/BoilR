[package]
name = "boilr-proto"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "boilr-proto"
path = "src/main.rs"

[[bin]]
name = "fake-game"
path = "src/bin/fake_game.rs"

[dependencies]
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
] }

[profile.release]
debug = false

# Standalone: not part of the BoilR workspace.
[workspace]
